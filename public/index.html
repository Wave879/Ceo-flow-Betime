<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEOFlow</title>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #94a3b8; }
    .card { text-align: center; padding: 2rem; }
    .dot { display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    h1 { color: #f1f5f9; font-size: 1.5rem; margin: 0.5rem 0; }
    p { font-size: 0.9rem; margin: 0.25rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <p><span class="dot"></span>ระบบทำงานปกติ</p>
    <h1>CEOFlow</h1>
    <p>LINE Webhook &amp; Task Management System</p>
  </div>
</body>
</html>
